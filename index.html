<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Visor STL 3D</title>

<style>

html,
body {

  margin: 0;

  width: 100%;

  height: 100%;

  overflow: hidden;

  background: #202020;

  font-family: Arial, sans-serif;

  touch-action: none;

}


#viewer {

  width: 100%;

  height: 100%;

}


#info {

  position: fixed;

  top: 0;

  left: 0;

  right: 0;

  z-index: 10;

  padding: 12px;

  text-align: center;

  color: white;

  background: rgba(0,0,0,0.75);

  font-size: 14px;

}


#controls {

  position: fixed;

  bottom: 20px;

  left: 50%;

  transform: translateX(-50%);

  z-index: 20;

  display: flex;

  gap: 8px;

  flex-wrap: wrap;

  justify-content: center;

  width: 95%;

}


button {

  border: none;

  border-radius: 12px;

  padding: 12px 16px;

  background: #ffffff;

  color: #222;

  font-size: 14px;

  font-weight: bold;

  box-shadow: 0 3px 10px rgba(0,0,0,0.3);

}


button:active {

  transform: scale(0.95);

}


input[type="file"] {

  display: none;

}


#dimensions {

  position: fixed;

  left: 10px;

  bottom: 20px;

  z-index: 10;

  color: white;

  background: rgba(0,0,0,0.7);

  padding: 10px;

  border-radius: 10px;

  font-size: 13px;

  display: none;

}


</style>

</head>


<body>


<div id="info">

  Selecciona un archivo STL para comenzar

</div>


<div id="viewer"></div>


<div id="dimensions"></div>


<div id="controls">


  <label for="fileInput">

    <button type="button"
            onclick="document.getElementById('fileInput').click()">

      📂 Abrir STL

    </button>

  </label>


  <input
    id="fileInput"
    type="file"
    accept=".stl,model/stl">


  <button id="resetButton">

    🔄 Centrar

  </button>


  <button id="wireButton">

    🕸️ Wireframe

  </button>


  <button id="colorButton">

    🎨 Color

  </button>


</div>


<script type="module">


import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';


import { OrbitControls } from
'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js';


import { STLLoader } from
'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/STLLoader.js';



/* =====================================================
   ESCENA
===================================================== */


const scene =
new THREE.Scene();


scene.background =
new THREE.Color(0x202020);



/* =====================================================
   CAMARA
===================================================== */


const camera =
new THREE.PerspectiveCamera(

  45,

  window.innerWidth /
  window.innerHeight,

  0.01,

  1000000

);


camera.position.set(
 100,
 100,
 100
);



/* =====================================================
   RENDERER
===================================================== */


const renderer =
new THREE.WebGLRenderer({

  antialias: true,

  powerPreference: "high-performance"

});


renderer.setPixelRatio(

  Math.min(
    window.devicePixelRatio,
    2
  )

);


renderer.setSize(

  window.innerWidth,

  window.innerHeight

);


document
.getElementById("viewer")
.appendChild(renderer.domElement);



/* =====================================================
   LUCES
===================================================== */


const ambientLight =
new THREE.AmbientLight(

  0xffffff,

  2

);


scene.add(ambientLight);


const directionalLight =
new THREE.DirectionalLight(

  0xffffff,

  2

);


directionalLight.position.set(

  1,
  1,
  1

);


scene.add(directionalLight);



/* =====================================================
   CONTROLES
===================================================== */


const controls =
new OrbitControls(

  camera,

  renderer.domElement

);


controls.enableDamping = true;

controls.dampingFactor = 0.08;

controls.enablePan = true;

controls.enableZoom = true;

controls.rotateSpeed = 0.7;

controls.zoomSpeed = 1.0;



/* =====================================================
   STL LOADER
===================================================== */


const loader =
new STLLoader();


let model = null;

let originalMaterial = null;

let modelSize = null;



/* =====================================================
   ELEMENTOS HTML
===================================================== */


const info =
document.getElementById("info");


const dimensions =
document.getElementById("dimensions");


const fileInput =
document.getElementById("fileInput");


const resetButton =
document.getElementById("resetButton");


const wireButton =
document.getElementById("wireButton");


const colorButton =
document.getElementById("colorButton");



/* =====================================================
   CARGAR STL
===================================================== */


fileInput.addEventListener(

  "change",

  function(event) {


    const file =
    event.target.files[0];


    if (!file) {

      return;

    }


    if (
      !file.name
      .toLowerCase()
      .endsWith(".stl")
    ) {

      info.textContent =
      "❌ El archivo no es un STL";

      return;

    }


    info.textContent =
    "⏳ Cargando " +
    file.name +
    "...";


    const reader =
    new FileReader();


    reader.onload = function(e) {


      try {


        const geometry =
        loader.parse(
          e.target.result
        );


        cargarModelo(

          geometry,

          file

        );


      }

      catch(error) {


        console.error(error);


        info.textContent =
        "❌ Error al leer el STL";


      }

    };


    reader.onerror = function() {


      info.textContent =
      "❌ No se pudo leer el archivo";


    };


    reader.readAsArrayBuffer(file);


  }

);



/* =====================================================
   CREAR MODELO
===================================================== */


function cargarModelo(
  geometry,
  file
) {


  /* Eliminar modelo anterior */

  if (model) {

    scene.remove(model);

    model.geometry.dispose();

    model.material.dispose();

    model = null;

  }


  /* Calcular normales */

  geometry.computeVertexNormals();


  /* Bounding box */

  geometry.computeBoundingBox();


  const box =
  geometry.boundingBox;


  const center =
  new THREE.Vector3();


  box.getCenter(center);


  const size =
  new THREE.Vector3();


  box.getSize(size);


  modelSize =
  size.clone();


  /* Material */

  originalMaterial =
  new THREE.MeshStandardMaterial({

    color: 0xb0b0b0,

    roughness: 0.65,

    metalness: 0.1

  });


  /* Mesh */

  model =
  new THREE.Mesh(

    geometry,

    originalMaterial

  );


  /* Centrar modelo */

  model.position.sub(center);


  scene.add(model);


  /* =================================================
     INFORMACION
  ================================================= */


  const sizeX =
  size.x.toFixed(2);


  const sizeY =
  size.y.toFixed(2);


  const sizeZ =
  size.z.toFixed(2);


  const sizeKB =
  (file.size / 1024).toFixed(1);


  info.textContent =
  "📦 " + file.name;


  dimensions.innerHTML =

  "X: " + sizeX + "<br>" +

  "Y: " + sizeY + "<br>" +

  "Z: " + sizeZ + "<br>" +

  "Archivo: " + sizeKB + " KB";


  dimensions.style.display =
  "block";


  /* Centrar cámara */

  ajustarCamara(size);


}



/* =====================================================
   AJUSTAR CAMARA
===================================================== */


function ajustarCamara(size) {


  const maxSize =
  Math.max(

    size.x,

    size.y,

    size.z

  );


  const distance =
  maxSize * 2.2;


  camera.position.set(

    distance,

    distance,

    distance

  );


  camera.near =
  Math.max(
    maxSize / 10000,
    0.001
  );


  camera.far =
  Math.max(
    maxSize * 100,
    1000
  );


  camera.updateProjectionMatrix();


  controls.target.set(

    0,
    0,
    0

  );


  controls.update();


}



/* =====================================================
   BOTON CENTRAR
===================================================== */


resetButton.addEventListener(

  "click",

  function() {


    if (!model || !modelSize) {

      return;

    }


    ajustarCamara(modelSize);


  }

);



/* =====================================================
   WIREFRAME
===================================================== */


let wireframe = false;


wireButton.addEventListener(

  "click",

  function() {


    if (!model) {

      return;

    }


    wireframe =
    !wireframe;


    model.material.wireframe =
    wireframe;


    wireButton.textContent =

      wireframe

      ? "🕸️ Sólido"

      : "🕸️ Wireframe";


  }

);



/* =====================================================
   CAMBIAR COLOR
===================================================== */


const colores = [

  0xb0b0b0,

  0x00aaff,

  0xff5555,

  0x55cc55,

  0xffaa00,

  0xffffff

];


let colorIndex = 0;


colorButton.addEventListener(

  "click",

  function() {


    if (!model) {

      return;

    }


    colorIndex++;


    if (
      colorIndex >= colores.length
    ) {

      colorIndex = 0;

    }


    model.material.color.setHex(

      colores[colorIndex]

    );


  }

);



/* =====================================================
   RESIZE
===================================================== */


window.addEventListener(

  "resize",

  function() {


    camera.aspect =

      window.innerWidth /
      window.innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(

      window.innerWidth,

      window.innerHeight

    );


  }

);



/* =====================================================
   ANIMACION
===================================================== */


function animate() {


  requestAnimationFrame(
    animate
  );


  controls.update();


  renderer.render(

    scene,

    camera

  );


}


animate();


</script>


</body>

</html>
