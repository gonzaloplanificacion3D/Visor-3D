<head>

<title>Visor 3D STL</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {

  margin: 0;
  padding: 0;

  width: 100%;
  height: 100%;

  overflow: hidden;

  color: white;

  background: #111;

  font-size: 14px;

  white-space: nowrap;

}


</style>

</head>


<body>


<div id="viewer"></div>


<div id="info">
  Cargando visor...
</div>


<div id="dimensions"></div>


<div id="shareMessage">
  Enlace copiado
</div>


<div id="menu">


  <button id="menuButton">
    ☰
  </button>


  <div id="menuPanel">


    <button id="resetButton">
      🔄 Centrar modelo
    </button>


    <button id="wireButton">
      🕸️ Wireframe
    </button>


    <button id="colorButton">
      🎨 Cambiar color
    </button>


    <button id="shareButton">
      🔗 Compartir modelo
    </button>


    <button id="homeButton">
      🏠 Ver modelos
    </button>


  </div>


</div>



<script type="module">


/* =====================================================
   THREE.JS
===================================================== */


import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';


import { OrbitControls } from
'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js';


import { STLLoader } from
'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/STLLoader.js';



/* =====================================================
   ELEMENTOS
===================================================== */


const info =
document.getElementById("info");


const dimensions =
document.getElementById("dimensions");


const menuButton =
document.getElementById("menuButton");


const menuPanel =
document.getElementById("menuPanel");


const resetButton =
document.getElementById("resetButton");


const wireButton =
document.getElementById("wireButton");


const colorButton =
document.getElementById("colorButton");


const shareButton =
document.getElementById("shareButton");


const homeButton =
document.getElementById("homeButton");


const shareMessage =
document.getElementById("shareMessage");



/* =====================================================
   ESCENA
===================================================== */


const scene =
new THREE.Scene();


scene.background =
new THREE.Color(0x202020);



/* =====================================================
   CAMARA
===================================================== */


const camera =
new THREE.PerspectiveCamera(

  45,

  window.innerWidth /
  window.innerHeight,

  0.001,

  1000000

);


camera.position.set(
 100,
 100,
 100
);



/* =====================================================
   RENDERER
===================================================== */


const renderer =
new THREE.WebGLRenderer({

  antialias: true,

  powerPreference: "high-performance"

});


renderer.setPixelRatio(

  Math.min(
    window.devicePixelRatio || 1,
    2
  )

);


renderer.setSize(

  window.innerWidth,

  window.innerHeight

);


document
.getElementById("viewer")
.appendChild(renderer.domElement);



/* =====================================================
   LUCES
===================================================== */


const ambientLight =
new THREE.AmbientLight(

  0xffffff,

  1.8

);


scene.add(ambientLight);


const light1 =
new THREE.DirectionalLight(

  0xffffff,

  2

);


light1.position.set(
 1,
 1,
 1
);


scene.add(light1);


const light2 =
new THREE.DirectionalLight(

  0xffffff,

  1

);


light2.position.set(
 -1,
 -1,
 -1
);


scene.add(light2);



/* =====================================================
   CONTROLES
===================================================== */


const controls =
new OrbitControls(

  camera,

  renderer.domElement

);


controls.enableDamping =
true;


controls.dampingFactor =
0.08;


controls.enableZoom =
true;


controls.enablePan =
true;


controls.rotateSpeed =
0.7;


controls.zoomSpeed =
1.0;



/* =====================================================
   VARIABLES DEL MODELO
===================================================== */


const loader =
new STLLoader();


let model = null;

let modelGeometry = null;

let modelMaterial = null;

let modelSize = null;

let wireframe = false;

let colorIndex = 0;



const colors = [

  0xb0b0b0,

  0x00aaff,

  0xff5555,

  0x55cc55,

  0xffaa00,

  0xffffff

];



/* =====================================================
   OBTENER MODELO DESDE LA URL
===================================================== */


const params =
new URLSearchParams(
  window.location.search
);


const modelo =
params.get("modelo");



/* =====================================================
   CARGAR MODELO
===================================================== */


function cargarModelo() {


  if (!modelo) {


    info.textContent =
      "Visor 3D — falta indicar un modelo";


    mostrarAyuda();


    return;

  }


  /*
    IMPORTANTE:

    El nombre que aparece después de
    ?modelo= debe coincidir con el
    nombre del STL que tengas en GitHub.
  */


  const archivo =
    decodeURIComponent(modelo);


  const url =
    "./" + archivo;


  info.textContent =
    "⏳ Cargando " + archivo + "...";


  loader.load(

    url,


    function(geometry) {


      console.log(
        "STL cargado:",
        url
      );


      crearModelo(

        geometry,

        archivo

      );


    },


    function(xhr) {


      if (xhr.total) {


        const porcentaje =
          Math.round(

            xhr.loaded /
            xhr.total *
            100

          );


        info.textContent =

          "⏳ Cargando " +
          archivo +
          " — " +
          porcentaje +
          "%";


      }

    },


    function(error) {


      console.error(
        "Error cargando STL:",
        error
      );


      info.innerHTML =

        "❌ No se pudo cargar el modelo<br>" +

        "<small>" +
        archivo +
        "</small>";


    }

  );

}



/* =====================================================
   CREAR MODELO
===================================================== */


function crearModelo(
  geometry,
  nombre
) {


  /* Eliminar modelo anterior */

  if (model) {

    scene.remove(model);

    if (model.geometry) {

      model.geometry.dispose();

    }

    if (model.material) {

      model.material.dispose();

    }

  }


  modelGeometry =
    geometry;


  geometry.computeVertexNormals();


  geometry.computeBoundingBox();


  const box =
    geometry.boundingBox;


  const center =
    new THREE.Vector3();


  box.getCenter(center);


  const size =
    new THREE.Vector3();


  box.getSize(size);


  modelSize =
    size.clone();


  /* Material */

  modelMaterial =
    new THREE.MeshStandardMaterial({

      color: colors[colorIndex],

      roughness: 0.65,

      metalness: 0.1,

      side: THREE.DoubleSide

    });


  /* Modelo */

  model =
    new THREE.Mesh(

      geometry,

      modelMaterial

    );


  /*
    Centramos el modelo para que
    el OrbitControls funcione bien.
  */


  model.position.sub(center);


  scene.add(model);


  /* Información */

  info.textContent =
    "📦 " + nombre;


  dimensions.innerHTML =

    "<b>Dimensiones</b><br>" +

    "X: " +
    size.x.toFixed(2) +
    " mm<br>" +

    "Y: " +
    size.y.toFixed(2) +
    " mm<br>" +

    "Z: " +
    size.z.toFixed(2) +
    " mm";


  dimensions.style.display =
    "block";


  /* Centrar cámara */

  ajustarCamara(size);


}



/* =====================================================
   AJUSTAR CAMARA
===================================================== */


function ajustarCamara(size) {


  if (!size) {

    return;

  }


  const maxSize =
    Math.max(

      size.x,

      size.y,

      size.z

    );


  const distancia =
    maxSize * 2.2;


  camera.position.set(

    distancia,

    distancia,

    distancia

  );


  camera.near =
    Math.max(
      maxSize / 10000,
      0.001
    );


  camera.far =
    Math.max(
      maxSize * 100,
      1000
    );


  camera.updateProjectionMatrix();


  controls.target.set(
    0,
    0,
    0
  );


  controls.update();

}



/* =====================================================
   MENU
===================================================== */


menuButton.addEventListener(

  "click",

  function() {


    if (
      menuPanel.style.display ===
      "block"
    ) {

      menuPanel.style.display =
        "none";

    }

    else {

      menuPanel.style.display =
        "block";

    }

  }

);



/* =====================================================
   CENTRAR
===================================================== */


resetButton.addEventListener(

  "click",

  function() {


    ajustarCamara(modelSize);


  }

);



/* =====================================================
   WIREFRAME
===================================================== */


wireButton.addEventListener(

  "click",

  function() {


    if (!model) {

      return;

    }


    wireframe =
      !wireframe;


    model.material.wireframe =
      wireframe;


    wireButton.textContent =

      wireframe

        ? "🕸️ Vista sólida"

        : "🕸️ Wireframe";


  }

);



/* =====================================================
   CAMBIAR COLOR
===================================================== */


colorButton.addEventListener(

  "click",

  function() {


    if (!model) {

      return;

    }


    colorIndex++;


    if (
      colorIndex >= colors.length
    ) {

      colorIndex = 0;

    }


    model.material.color.setHex(

      colors[colorIndex]

    );

  }

);



/* =====================================================
   COMPARTIR
===================================================== */


shareButton.addEventListener(

  "click",

  async function() {


    const url =
      window.location.href;


    try {


      if (
        navigator.share
      ) {


        await navigator.share({

          title:
            "Visor 3D",

          text:
            "Visualiza este modelo 3D",

          url:
            url

        });


      }

      else {


        await navigator.clipboard.writeText(
          url
        );


        mostrarMensaje(
          "🔗 Enlace copiado"
        );


      }

    }

    catch(error) {


      console.log(
        "Compartir cancelado"
      );


    }

  }

);



/* =====================================================
   VOLVER AL INICIO
===================================================== */


homeButton.addEventListener(

  "click",

  function() {


    window.location.href =
      window.location.pathname;


  }

);



/* =====================================================
   MENSAJE
===================================================== */


function mostrarMensaje(texto) {


  shareMessage.textContent =
    texto;


  shareMessage.style.display =
    "block";


  setTimeout(

    function() {

      shareMessage.style.display =
        "none";

    },

    2000

  );

}



/* =====================================================
   AYUDA SI NO HAY MODELO
===================================================== */


function mostrarAyuda() {


  dimensions.style.display =
    "block";


  dimensions.innerHTML =

    "<b>Cómo abrir un modelo</b><br><br>" +

    "Agrega el nombre del STL en la URL:<br><br>" +

    "?modelo=ventaja.stl";

}



/* =====================================================
   RESIZE
===================================================== */


window.addEventListener(

  "resize",

  function() {


    camera.aspect =

      window.innerWidth /
      window.innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(

      window.innerWidth,

      window.innerHeight

    );

  }

);



/* =====================================================
   ANIMACION
===================================================== */


function animate() {


  requestAnimationFrame(
    animate
  );


  controls.update();


  renderer.render(

    scene,

    camera

  );


}


animate();



/* =====================================================
   INICIAR
===================================================== */


cargarModelo();


</script>

</body>

</html>
```
