<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Visor 3D</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #202020;
      font-family: Arial, sans-serif;
    }

    #viewer {
      width: 100%;
      height: 100%;
    }

    #info {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;
      padding: 14px;
      text-align: center;
      color: white;
      background: rgba(0,0,0,0.75);
      font-size: 16px;
    }
  </style>

  <!-- Importmap de Three.js -->

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>

</head>

<body>

<div id="info">Cargando modelo 3D...</div>

<div id="viewer"></div>


<script type="module">

import * as THREE from 'three';

import {
  OrbitControls
} from 'three/addons/controls/OrbitControls.js';

import {
  STLLoader
} from 'three/addons/loaders/STLLoader.js';


/* =========================
   ESCENA
========================= */

const scene = new THREE.Scene();

scene.background =
  new THREE.Color(0x202020);


/* =========================
   CAMARA
========================= */

const camera =
  new THREE.PerspectiveCamera(
    45,
    window.innerWidth /
    window.innerHeight,
    0.1,
    100000
  );


/* =========================
   RENDER
========================= */

const renderer =
  new THREE.WebGLRenderer({
    antialias: true
  });

renderer.setPixelRatio(
  window.devicePixelRatio
);

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

document
  .getElementById("viewer")
  .appendChild(renderer.domElement);


/* =========================
   LUCES
========================= */

const ambient =
  new THREE.AmbientLight(
    0xffffff,
    1.5
  );

scene.add(ambient);


const directional =
  new THREE.DirectionalLight(
    0xffffff,
    2
  );

directional.position.set(
  1,
  1,
  1
);

scene.add(directional);


/* =========================
   CONTROLES
========================= */

const controls =
  new OrbitControls(
    camera,
    renderer.domElement
  );

controls.enableDamping = true;

controls.dampingFactor = 0.05;

controls.screenSpacePanning = true;


/* =========================
   STL
========================= */

const loader =
  new STLLoader();


const modelUrl =
  "./ventaja.stl";


document.getElementById("info")
  .textContent =
  "Cargando modelo 3D...";


loader.load(

  modelUrl,


  /* ÉXITO */

  function(geometry) {

    console.log(
      "STL cargado correctamente"
    );


    geometry.computeBoundingBox();


    const box =
      geometry.boundingBox;


    const center =
      new THREE.Vector3();


    box.getCenter(center);


    const size =
      new THREE.Vector3();


    box.getSize(size);


    const model =
      new THREE.Mesh(

        geometry,

        new THREE.MeshStandardMaterial({
          color: 0xb0b0b0,
          roughness: 0.7,
          metalness: 0.1
        })

      );


    scene.add(model);


    /* Centrar */

    model.position.sub(center);


    /* Tamaño */

    const maxSize =
      Math.max(
        size.x,
        size.y,
        size.z
      );


    /* Cámara */

    camera.position.set(
      maxSize * 1.5,
      maxSize * 1.5,
      maxSize * 1.5
    );


    camera.lookAt(
      0,
      0,
      0
    );


    controls.target.set(
      0,
      0,
      0
    );


    controls.update();


    document.getElementById("info")
      .textContent =
      "Visor 3D — rota y haz zoom";


  },


  /* PROGRESO */

  function(xhr) {

    if (xhr.total) {

      const percent =
        Math.round(
          xhr.loaded /
          xhr.total *
          100
        );


      document.getElementById("info")
        .textContent =
        "Cargando modelo 3D... " +
        percent +
        "%";

    }

  },


  /* ERROR */

  function(error) {

    console.error(
      "ERROR STL:",
      error
    );


    document.getElementById("info")
      .textContent =
      "ERROR: no se pudo cargar el STL";

  }

);


/* =========================
   RESIZE
========================= */

window.addEventListener(
  "resize",
  function() {

    camera.aspect =
      window.innerWidth /
      window.innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

  }
);


/* =========================
   ANIMACION
========================= */

function animate() {

  requestAnimationFrame(
    animate
  );


  controls.update();


  renderer.render(
    scene,
    camera
  );

}


animate();

</script>

</body>
</html>
