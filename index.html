<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Visor 3D</title>

<style>

html, body {

  margin: 0;

  width: 100%;

  height: 100%;

  overflow: hidden;

  background: #202020;

  font-family: Arial, sans-serif;

}

#viewer {

  width: 100%;

  height: 100%;

}

#info {

  position: fixed;

  top: 0;

  left: 0;

  right: 0;

  z-index: 10;

  padding: 14px;

  text-align: center;

  color: white;

  background: rgba(0,0,0,0.75);

}

</style>

</head>


<body>

<div id="info">
Cargando modelo 3D...
</div>

<div id="viewer"></div>


<script type="module">

import * as THREE
from
'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

import { OrbitControls }
from
'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js';

import { STLLoader }
from
'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/STLLoader.js';


/* ESCENA */

const scene =
new THREE.Scene();

scene.background =
new THREE.Color(0x202020);


/* CAMARA */

const camera =
new THREE.PerspectiveCamera(

  45,

  window.innerWidth /
  window.innerHeight,

  0.1,

  100000

);


/* RENDER */

const renderer =
new THREE.WebGLRenderer({

  antialias: true

});


renderer.setPixelRatio(
window.devicePixelRatio
);

renderer.setSize(
window.innerWidth,
window.innerHeight
);


document
.getElementById("viewer")
.appendChild(renderer.domElement);


/* LUCES */

scene.add(

  new THREE.AmbientLight(
    0xffffff,
    1.5
  )

);


const light =
new THREE.DirectionalLight(
  0xffffff,
  2
);


light.position.set(
  1,
  1,
  1
);


scene.add(light);


/* CONTROLES */

const controls =
new OrbitControls(

  camera,

  renderer.domElement

);


controls.enableDamping =
true;


/* STL */

const loader =
new STLLoader();


const modelUrl =
"./ventaja.stl";


loader.load(

  modelUrl,


  function(geometry) {


    console.log(
      "STL cargado correctamente"
    );


    geometry.computeBoundingBox();


    const box =
    geometry.boundingBox;


    const center =
    new THREE.Vector3();


    box.getCenter(center);


    const size =
    new THREE.Vector3();


    box.getSize(size);


    const material =
    new THREE.MeshStandardMaterial({

      color: 0xb0b0b0,

      roughness: 0.7,

      metalness: 0.1

    });


    const model =
    new THREE.Mesh(

      geometry,

      material

    );


    scene.add(model);


    model.position.sub(center);


    const maxSize =
    Math.max(

      size.x,

      size.y,

      size.z

    );


    camera.position.set(

      maxSize * 1.5,

      maxSize * 1.5,

      maxSize * 1.5

    );


    camera.lookAt(
      0,
      0,
      0
    );


    controls.target.set(
      0,
      0,
      0
    );


    controls.update();


    document
    .getElementById("info")
    .textContent =
    "Visor 3D — rota y haz zoom";


  },


  function(xhr) {


    if (xhr.total) {


      const percent =
      Math.round(

        xhr.loaded /
        xhr.total *
        100

      );


      document
      .getElementById("info")
      .textContent =

      "Cargando modelo 3D... "
      + percent + "%";


    }


  },


  function(error) {


    console.error(
      error
    );


    document
    .getElementById("info")
    .textContent =

    "ERROR: no se pudo cargar el STL";


  }

);


/* RESIZE */

window.addEventListener(

  "resize",

  function() {


    camera.aspect =

      window.innerWidth /
      window.innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(

      window.innerWidth,

      window.innerHeight

    );


  }

);


/* ANIMACION */

function animate() {


  requestAnimationFrame(
    animate
  );


  controls.update();


  renderer.render(

    scene,

    camera

  );


}


animate();

</script>

</body>

</html>
