<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Visor 3D STL</title>


<!-- =====================================================
     IMPORT MAP
===================================================== -->

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>


<style>

* {
  box-sizing: border-box;
}

html,
body {

  margin: 0;
  padding: 0;

  width: 100%;
  height: 100%;

  overflow: hidden;

  background: #202020;

  font-family: Arial, sans-serif;

}

}

  width: 48px;

</head>


<body>


<div id="viewer"></div>


<div id="info">
  Iniciando visor...
</div>


<div id="dimensions"></div>


<div id="menu">


  <button id="menuButton">
    ☰
  </button>


  <div id="menuPanel">


    <button id="resetButton">
      🔄 Centrar
    </button>


    <button id="wireButton">
      🕸️ Wireframe
    </button>


    <button id="colorButton">
      🎨 Cambiar color
    </button>


    <button id="shareButton">
      🔗 Compartir
    </button>


    <button id="homeButton">
      🏠 Inicio
    </button>


  </div>


</div>


<script type="module">


/* =====================================================
   IMPORTACIONES
===================================================== */


import * as THREE from "three";

import { OrbitControls }
from "three/addons/controls/OrbitControls.js";

import { STLLoader }
from "three/addons/loaders/STLLoader.js";



/* =====================================================
   ELEMENTOS
===================================================== */


const info =
document.getElementById("info");


const dimensions =
document.getElementById("dimensions");


const menuButton =
document.getElementById("menuButton");


const menuPanel =
document.getElementById("menuPanel");


const resetButton =
document.getElementById("resetButton");


const wireButton =
document.getElementById("wireButton");


const colorButton =
document.getElementById("colorButton");


const shareButton =
document.getElementById("shareButton");


const homeButton =
document.getElementById("homeButton");



/* =====================================================
   ESCENA
===================================================== */


const scene =
new THREE.Scene();


scene.background =
new THREE.Color(0x202020);



/* =====================================================
   CAMARA
===================================================== */


const camera =
new THREE.PerspectiveCamera(

  45,

  window.innerWidth /
  window.innerHeight,

  0.001,

  1000000

);


camera.position.set(
 100,
 100,
 100
);



/* =====================================================
   RENDERER
===================================================== */


let renderer;


try {


  renderer =
    new THREE.WebGLRenderer({

      antialias: true,

      powerPreference:
        "high-performance"

    });


  renderer.setPixelRatio(

    Math.min(
      window.devicePixelRatio || 1,
      2
    )

  );


  renderer.setSize(

    window.innerWidth,

    window.innerHeight

  );


  document
    .getElementById("viewer")
    .appendChild(
      renderer.domElement
    );


}

catch (error) {


  console.error(error);


  info.innerHTML =
    "❌ Tu navegador no puede iniciar WebGL";


  throw error;

}



/* =====================================================
   LUCES
===================================================== */


const ambientLight =
new THREE.AmbientLight(

  0xffffff,

  2

);


scene.add(
  ambientLight
);


const directionalLight =
new THREE.DirectionalLight(

  0xffffff,

  2

);


directionalLight.position.set(
  1,
  1,
  1
);


scene.add(
  directionalLight
);



/* =====================================================
   CONTROLES
===================================================== */


const controls =
new OrbitControls(

  camera,

  renderer.domElement

);


controls.enableDamping =
true;


controls.dampingFactor =
0.08;


controls.enableZoom =
true;


controls.enablePan =
true;


controls.rotateSpeed =
0.7;


controls.zoomSpeed =
1;



/* =====================================================
   STL
===================================================== */


const loader =
new STLLoader();


let model = null;

let modelSize = null;

let wireframe = false;

let colorIndex = 0;


const colors = [

  0xb0b0b0,
  0x00aaff,
  0xff5555,
  0x55cc55,
  0xffaa00,
  0xffffff

];



/* =====================================================
   LEER URL
===================================================== */


const params =
new URLSearchParams(
  window.location.search
);


const modelo =
params.get("modelo");



/* =====================================================
   CARGAR STL
===================================================== */


async function cargarSTL() {


  if (!modelo) {


    info.innerHTML =

      "Visor 3D STL<br>" +

      "<small>" +
      "Indica un modelo en la URL"
      +
      "</small>";


    return;

  }


  const nombreArchivo =
    decodeURIComponent(modelo);


  /*
    encodeURI permite que funcionen
    espacios y caracteres especiales,
    pero conserva las barras.
  */


  const url =
    "./" +
    encodeURI(nombreArchivo);


  console.log(
    "URL STL:",
    url
  );


  info.textContent =
    "⏳ Descargando STL...";


  try {


    const response =
      await fetch(url);


    console.log(
      "Respuesta:",
      response.status,
      response.statusText
    );


    if (!response.ok) {

      throw new Error(

        "HTTP " +
        response.status

      );

    }


    info.textContent =
      "⏳ Procesando STL...";


    const arrayBuffer =
      await response.arrayBuffer();


    console.log(
      "Tamaño:",
      arrayBuffer.byteLength,
      "bytes"
    );


    if (
      arrayBuffer.byteLength === 0
    ) {

      throw new Error(
        "El archivo está vacío"
      );

    }


    const geometry =
      loader.parse(
        arrayBuffer
      );


    crearModelo(
      geometry,
      nombreArchivo
    );


  }

  catch (error) {


    console.error(
      "ERROR STL:",
      error
    );


    info.innerHTML =

      "❌ No se pudo cargar el STL<br>" +

      "<small>" +
      error.message +
      "</small>";

  }

}



/* =====================================================
   CREAR MODELO
===================================================== */


function crearModelo(
  geometry,
  nombre
) {


  geometry.computeVertexNormals();

  geometry.computeBoundingBox();


  const box =
    geometry.boundingBox;


  if (!box) {

    throw new Error(
      "El STL no contiene geometría"
    );

  }


  const center =
    new THREE.Vector3();


  box.getCenter(center);


  const size =
    new THREE.Vector3();


  box.getSize(size);


  modelSize =
    size.clone();


  /*
    Crear material
  */


  const material =
    new THREE.MeshStandardMaterial({

      color:
        colors[colorIndex],

      roughness:
        0.65,

      metalness:
        0.1,

      side:
        THREE.DoubleSide

    });


  /*
    Crear modelo
  */


  model =
    new THREE.Mesh(

      geometry,

      material

    );


  /*
    Centrar
  */


  model.position.sub(center);


  scene.add(
    model
  );


  /*
    Información
  */


  info.textContent =
    "📦 " + nombre;


  dimensions.innerHTML =

    "<b>Dimensiones</b><br>" +

    "X: " +
    size.x.toFixed(2) +
    " mm<br>" +

    "Y: " +
    size.y.toFixed(2) +
    " mm<br>" +

    "Z: " +
    size.z.toFixed(2) +
    " mm";


  dimensions.style.display =
    "block";


  ajustarCamara(
    size
  );


}



/* =====================================================
   CAMARA
===================================================== */


function ajustarCamara(size) {


  if (!size) {
    return;
  }


  const maxSize =
    Math.max(

      size.x,
      size.y,
      size.z

    );


  if (
    !isFinite(maxSize) ||
    maxSize <= 0
  ) {

    return;

  }


  const distancia =
    maxSize * 2.2;


  camera.position.set(

    distancia,
    distancia,
    distancia

  );


  camera.near =
    Math.max(
      maxSize / 10000,
      0.001
    );


  camera.far =
    Math.max(
      maxSize * 100,
      1000
    );


  camera.updateProjectionMatrix();


  controls.target.set(
    0,
    0,
    0
  );


  controls.update();

}



/* =====================================================
   MENU
===================================================== */


menuButton.addEventListener(

  "click",

  () => {


    menuPanel.style.display =

      menuPanel.style.display ===
      "block"

      ? "none"

      : "block";

  }

);



/* =====================================================
   CENTRAR
===================================================== */


resetButton.addEventListener(

  "click",

  () => {

    ajustarCamara(
      modelSize
    );

  }

);



/* =====================================================
   WIREFRAME
===================================================== */


wireButton.addEventListener(

  "click",

  () => {


    if (!model) {
      return;
    }


    wireframe =
      !wireframe;


    model.material.wireframe =
      wireframe;


    wireButton.textContent =

      wireframe

      ? "🕸️ Vista sólida"

      : "🕸️ Wireframe";

  }

);



/* =====================================================
   COLOR
===================================================== */


colorButton.addEventListener(

  "click",

  () => {


    if (!model) {
      return;
    }


    colorIndex++;


    if (
      colorIndex >=
      colors.length
    ) {

      colorIndex = 0;

    }


    model.material.color.setHex(

      colors[colorIndex]

    );

  }

);



/* =====================================================
   COMPARTIR
===================================================== */


shareButton.addEventListener(

  "click",

  async () => {


    const url =
      window.location.href;


    try {


      if (
        navigator.share
      ) {


        await navigator.share({

          title:
            "Visor 3D STL",

          text:
            "Visualiza este modelo 3D",

          url:
            url

        });


      }

      else {


        await navigator.clipboard
          .writeText(url);


        alert(
          "Enlace copiado"
        );

      }

    }

    catch(error) {

      console.log(
        "Compartir cancelado"
      );

    }

  }

);



/* =====================================================
   INICIO
===================================================== */


homeButton.addEventListener(

  "click",

  () => {


    window.location.href =
      window.location.pathname;

  }

);



/* =====================================================
   RESIZE
===================================================== */


window.addEventListener(

  "resize",

  () => {


    camera.aspect =

      window.innerWidth /
      window.innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(

      window.innerWidth,

      window.innerHeight

    );

  }

);



/* =====================================================
   ANIMACION
===================================================== */


function animate() {


  requestAnimationFrame(
    animate
  );


  controls.update();


  renderer.render(
    scene,
    camera
  );


}


animate();



/* =====================================================
   INICIAR
===================================================== */


info.textContent =
"Visor iniciado. Cargando modelo...";


cargarSTL();


</script>

</body>

</html>
```
