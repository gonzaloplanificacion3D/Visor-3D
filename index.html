<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Visor 3D</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      overflow: hidden;
    }

    #info {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;
      padding: 12px 16px;
      background: rgba(20, 20, 20, 0.9);
      text-align: center;
      font-size: 16px;
    }

    #viewer {
      width: 100vw;
      height: 100vh;
    }

    #loading {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 20;
      background: rgba(0, 0, 0, 0.8);
      padding: 20px 30px;
      border-radius: 10px;
      display: none;
    }
  </style>
</head>

<body>

  <div id="info">Cargando modelo 3D...</div>
  <div id="loading">Cargando STL...</div>
  <div id="viewer"></div>

  <script type="module">

    import * as THREE from
      'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

    import { OrbitControls } from
      'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js';

    import { STLLoader } from
      'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/STLLoader.js';


    const scene = new THREE.Scene();

    scene.background = new THREE.Color(0x202020);


    const camera = new THREE.PerspectiveCamera(
      45,
      window.innerWidth / window.innerHeight,
      0.1,
      100000
    );


    const renderer = new THREE.WebGLRenderer({
      antialias: true
    });

    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);

    document
      .getElementById("viewer")
      .appendChild(renderer.domElement);


    // Luces

    const light1 = new THREE.DirectionalLight(0xffffff, 2);
    light1.position.set(1, 1, 1);
    scene.add(light1);


    const light2 = new THREE.DirectionalLight(0xffffff, 1);
    light2.position.set(-1, -1, -1);
    scene.add(light2);


    const ambient = new THREE.AmbientLight(0xffffff, 1);
    scene.add(ambient);


    // Controles de navegación

    const controls = new OrbitControls(
      camera,
      renderer.domElement
    );

    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    controls.screenSpacePanning = true;


    // Cargar STL

    const loader = new STLLoader();

    const modelUrl = "modelo.stl";

    document.getElementById("loading").style.display = "block";


    loader.load(

      modelUrl,

      function (geometry) {

        const material = new THREE.MeshStandardMaterial({
          color: 0xaaaaaa,
          metalness: 0.1,
          roughness: 0.7
        });


        const model = new THREE.Mesh(
          geometry,
          material
        );


        scene.add(model);


        // Centrar modelo

        geometry.computeBoundingBox();

        const box = geometry.boundingBox;

        const center = new THREE.Vector3();

        box.getCenter(center);

        model.position.sub(center);


        // Ajustar cámara

        const size = new THREE.Vector3();

        box.getSize(size);

        const maxDimension = Math.max(
          size.x,
          size.y,
          size.z
        );


        camera.position.set(
          maxDimension * 1.5,
          maxDimension * 1.5,
          maxDimension * 1.5
        );


        camera.lookAt(0, 0, 0);

        controls.target.set(0, 0, 0);

        controls.update();


        document.getElementById("loading").style.display = "none";

        document.getElementById("info").textContent =
          "Visor 3D — mueve el modelo con el dedo o mouse";


      },

      undefined,

      function (error) {

        document.getElementById("loading").style.display = "none";

        document.getElementById("info").textContent =
          "No se pudo cargar el modelo STL.";

        console.error(error);

      }

    );


    // Adaptación a celular / ventana

    window.addEventListener(
      "resize",
      function () {

        camera.aspect =
          window.innerWidth /
          window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
          window.innerWidth,
          window.innerHeight
        );

      }
    );


    // Animación

    function animate() {

      requestAnimationFrame(animate);

      controls.update();

      renderer.render(
        scene,
        camera
      );

    }

    animate();

  </script>

</body>
</html>
