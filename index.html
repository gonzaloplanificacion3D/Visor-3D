```html
<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Prueba STL</title>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>

<style>

html,
body {

  margin: 0;

  width: 100%;
  height: 100%;

  overflow: hidden;

  background: #202020;

  font-family: Arial, sans-serif;

}

#info {

  position: fixed;

  top: 0;
  left: 0;
  right: 0;

  z-index: 10;

  padding: 15px;

  background: black;

  color: white;

  text-align: center;

}

</style>

</head>


<body>


<div id="info">
Cargando visor...
</div>


<script type="module">


import * as THREE
from "three";


import { OrbitControls }
from "three/addons/controls/OrbitControls.js";


import { STLLoader }
from "three/addons/loaders/STLLoader.js";



const info =
document.getElementById("info");



/* ESCENA */

const scene =
new THREE.Scene();

scene.background =
new THREE.Color(0x202020);



/* CAMARA */

const camera =
new THREE.PerspectiveCamera(

  45,

  window.innerWidth /
  window.innerHeight,

  0.1,

  100000

);

camera.position.set(
 100,
 100,
 100
);



/* RENDERER */

const renderer =
new THREE.WebGLRenderer({

  antialias: true

});

renderer.setSize(

  window.innerWidth,

  window.innerHeight

);

renderer.setPixelRatio(

  Math.min(
    window.devicePixelRatio,
    2
  )

);

document.body.appendChild(
  renderer.domElement
);



/* LUCES */

scene.add(

  new THREE.AmbientLight(
    0xffffff,
    2
  )

);


const light =
new THREE.DirectionalLight(
  0xffffff,
  2
);


light.position.set(
  1,
  1,
  1
);


scene.add(light);



/* CONTROLES */

const controls =
new OrbitControls(

  camera,

  renderer.domElement

);

controls.enableDamping =
true;



/* STL */

const loader =
new STLLoader();



/*
=====================================================
OBTENER NOMBRE DEL STL DESDE LA URL
=====================================================
*/


const params =
new URLSearchParams(
  window.location.search
);


const archivo =
params.get("modelo");



if (!archivo) {


  info.textContent =
    "❌ No se indicó ningún STL";


}

else {


  cargarSTL(archivo);

}



/*
=====================================================
CARGAR STL
=====================================================
*/


async function cargarSTL(nombre) {


  info.textContent =
    "⏳ Cargando " +
    nombre +
    "...";


  /*
    encodeURIComponent solamente
    para el nombre del archivo.
  */


  const url =
    "./" +
    nombre
      .split("/")
      .map(
        parte =>
          encodeURIComponent(parte)
      )
      .join("/");


  console.log(
    "Cargando:",
    url
  );


  try {


    const respuesta =
      await fetch(url);


    console.log(
      "HTTP:",
      respuesta.status
    );


    if (!respuesta.ok) {

      throw new Error(

        "HTTP " +
        respuesta.status

      );

    }


    const buffer =
      await respuesta.arrayBuffer();


    console.log(
      "Bytes:",
      buffer.byteLength
    );


    info.textContent =
      "⏳ Procesando STL...";


    const geometry =
      loader.parse(
        buffer
      );


    geometry.computeVertexNormals();


    geometry.computeBoundingBox();


    const box =
      geometry.boundingBox;


    const center =
      new THREE.Vector3();


    box.getCenter(
      center
    );


    const size =
      new THREE.Vector3();


    box.getSize(
      size
    );


    /*
    MODELO
    */


    const material =
      new THREE.MeshStandardMaterial({

        color: 0xb0b0b0,

        roughness: 0.7,

        metalness: 0.1

      });


    const model =
      new THREE.Mesh(

        geometry,

        material

      );


    model.position.sub(
      center
    );


    scene.add(model);



    /*
    CAMARA
    */


    const maxSize =
      Math.max(

        size.x,
        size.y,
        size.z

      );


    const distancia =
      maxSize * 2.2;


    camera.position.set(

      distancia,
      distancia,
      distancia

    );


    camera.near =
      maxSize / 10000;


    camera.far =
      maxSize * 100;


    camera.updateProjectionMatrix();


    controls.target.set(
      0,
      0,
      0
    );


    controls.update();



    /*
    INFORMACION
    */


    info.innerHTML =

      "📦 " +
      nombre +
      "<br>" +

      "X: " +
      size.x.toFixed(2) +
      " | " +

      "Y: " +
      size.y.toFixed(2) +
      " | " +

      "Z: " +
      size.z.toFixed(2);



  }

  catch(error) {


    console.error(
      error
    );


    info.innerHTML =

      "❌ ERROR<br>" +

      "<small>" +
      error.message +
      "</small>";

  }

}



/*
=====================================================
ANIMACION
=====================================================
*/


function animate() {


  requestAnimationFrame(
    animate
  );


  controls.update();


  renderer.render(

    scene,

    camera

  );

}


animate();



/*
=====================================================
RESIZE
=====================================================
*/


window.addEventListener(

  "resize",

  () => {


    camera.aspect =

      window.innerWidth /
      window.innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(

      window.innerWidth,

      window.innerHeight

    );


  }

);


</script>

</body>

</html>
